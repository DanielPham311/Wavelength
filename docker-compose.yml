services:
  postgres:
    image: postgres:16-alpine
    container_name: wavelength-postgres
    environment:
      POSTGRES_DB: wavelength
      POSTGRES_USER: wavelength
      POSTGRES_PASSWORD: wavelength_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wavelength-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
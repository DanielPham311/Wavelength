spring.application.name=wavelength-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/wavelength
spring.datasource.username=wavelength
spring.datasource.password=wavelength_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# JWT (replace secret with a real 256-bit key later)
jwt.secret=wavelength-super-secret-key-replace-in-production
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# File upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Cloudflare R2 (fill in after creating your R2 bucket)
r2.access-key=YOUR_R2_ACCESS_KEY
r2.secret-key=YOUR_R2_SECRET_KEY
r2.endpoint=https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
r2.bucket-name=wavelength-audio
r2.public-url=https://YOUR_CDN_URL